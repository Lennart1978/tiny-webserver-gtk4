<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Webserver Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.5;
            color: #555;
        }

        .status {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            background-color: #e6f4ea;
            color: #1e8e3e;
            border-radius: 20px;
            font-weight: bold;
        }

        #file-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        #file-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #f9f9f9;
        }

        #file-list a {
            color: #1a73e8;
            text-decoration: none;
        }

        #file-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Es funktioniert!</h1>
        <p>Herzlichen Glückwunsch, dein Tiny Webserver läuft korrekt.</p>
        <div class="status">Server Status: Online</div>

        <div style="margin-top: 2rem; text-align: left;">
            <h3>Dateien im Verzeichnis:</h3>
            <ul id="file-list">
                <li>Lade Dateien...</li>
            </ul>
        </div>
    </div>

    <script>
        fetch('/files.json')
            .then(response => response.json())
            .then(files => {
                const list = document.getElementById('file-list');
                list.innerHTML = '';
                if (files.length === 0) {
                    list.innerHTML = '<li>Keine Dateien gefunden.</li>';
                    return;
                }
                files.forEach(file => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = file;
                    a.textContent = file;
                    li.appendChild(a);
                    list.appendChild(li);
                });
            })
            .catch(err => {
                console.error('Fehler beim Laden der Dateien:', err);
                document.getElementById('file-list').innerHTML = '<li style="color: red;">Fehler beim Laden der Dateiliste.</li>';
            });
    </script>
</body>

</html>
